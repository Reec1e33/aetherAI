name: Feature request
description: Suggest a new feature, experiment, or change.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this request solve? Who has this problem?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change that you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe other solutions that you considered.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the open issues, and this request is not a duplicate.
          required: true
